<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>App Landing Hero</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#f5f5f5] font-sans">

  <section class="min-h-screen flex items-center">

    <div class="max-w-7xl mx-auto px-6 lg:px-16 w-full">

      <div class="grid grid-cols-1 lg:grid-cols-2 items-center gap-16">

        <!-- LEFT CONTENT -->
        <div class="text-center lg:text-left">

          <p class="text-[#1f2340] text-lg font-medium mb-6">
            Ready to Use Tailwind CSS Web Template.
          </p>

          <h1 class="text-4xl sm:text-5xl md:text-6xl font-bold mb-10 leading-tight">
            Tailwind Template for
            <span class="text-indigo-300/70 block">
              App & Software
            </span>
            site.
          </h1>

          <p class="mt-8 text-gray-500 text-lg leading-8 max-w-2xl mx-auto lg:mx-0">
            All in one Tailwind CSS site template for - App and Software and other
            <br>
            sites Comes with all essential components.
          </p>

          <!-- BUTTONS -->
          <div class="mt-10 flex flex-col sm:flex-row items-center gap-6">

            <!-- DOWNLOAD BUTTON -->
            <button class="bg-[#171c3a] hover:bg-[#0f1330] transition text-white px-8 py-4 rounded-xl flex items-center gap-5 shadow-lg">

              <span class="text-lg">Download Now</span>

              <span class="border-l border-gray-500 h-7"></span>

              <!-- Apple Icon -->
              <svg xmlns="http://www.w3.org/2000/svg"
                class="w-7 h-7"
                fill="currentColor"
                viewBox="0 0 24 24">
                <path d="M16.365 1.43c0 1.14-.41 2.02-1.23 2.88-.82.82-1.79 1.29-2.79 1.21-.12-1.09.35-2.06 1.11-2.85.79-.83 1.96-1.38 2.91-1.24zM20.92 17.08c-.47 1.08-.7 1.56-1.31 2.49-.85 1.33-2.05 2.99-3.53 3.01-1.32.02-1.66-.86-3.45-.85-1.8.01-2.18.87-3.5.85-1.48-.02-2.62-1.51-3.47-2.84-2.38-3.67-2.63-7.97-1.16-10.23 1.04-1.61 2.68-2.56 4.22-2.56 1.57 0 2.56.86 3.86.86 1.27 0 2.05-.86 3.84-.86 1.37 0 2.83.75 3.87 2.04-3.39 1.86-2.84 6.71.63 8.09z"/>
              </svg>
            </button>

            <!-- WATCH DEMO -->
            <div class="flex items-center gap-4 cursor-pointer">

              <div class="w-16 h-16 border-2 border-[#171c3a] rounded-full flex items-center justify-center hover:bg-[#171c3a] hover:text-white transition">

                <svg xmlns="http://www.w3.org/2000/svg"
                  class="w-6 h-6 ml-1"
                  fill="currentColor"
                  viewBox="0 0 24 24">
                  <path d="M8 5v14l11-7z"/>
                </svg>

              </div>

              <div>
                <p class="text-[#171c3a]">Watch Demo</p>
                <p class="text-[#171c3a] text-lg">
                  See how it works
                </p>
              </div>

            </div>

          </div>

        </div>

        <!-- RIGHT IMAGE SECTION -->
        <div class="relative flex justify-center items-center h-[500px] sm:h-[600px] lg:h-[650px]">

          <!-- RESPONSIVE CIRCLE -->
          <div class="absolute
                      w-[260px] h-[260px]
                      sm:w-[380px] sm:h-[380px]
                      md:w-[450px] md:h-[450px]
                      lg:w-[500px] lg:h-[500px]
                      rounded-full
                      bg-gradient-to-br
                      from-[#a8a6ff]
                      to-[#8cb7ff]">
          </div>

          <!-- PHONE IMAGE -->
          <img
            src="hero-light.png"
            alt="Phone Mockup"
            class="relative z-10
                   w-[180px]
                   sm:w-[240px]
                   md:w-[300px]
                   lg:w-[340px]
                   mt-10 sm:mt-14 lg:mt-16"
          />

          <!-- DECORATION STARS -->
          <div class="absolute top-16 right-8 sm:top-24 sm:right-16 text-[#6c7cff] text-3xl sm:text-5xl">
            ✦
          </div>

          <div class="absolute top-20 right-2 sm:top-28 sm:right-8 text-[#35d6c1] text-2xl sm:text-4xl">
            ✦
          </div>

          <!-- BOTTOM SHAPE -->
          <div class="absolute bottom-16 left-2 sm:bottom-24 sm:left-10">
            <div class="text-pink-400 text-4xl sm:text-6xl tracking-[-8px] leading-3">
              ≋
            </div>
          </div>

        </div>

      </div>

    </div>

  </section>

</body>
</html>
